name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting with black
        run: uv run --locked black --check .

      - name: Check import sorting with isort
        run: uv run --locked isort --check .

  backend-import-check:
    name: Backend Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify main modules import without errors
        run: |
          uv run --locked python -c "
          import config_manager
          import handlers
          import utils
          print('All core modules imported successfully')
          "

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked pytest --tb=short -q

  frontend-build:
    name: Frontend Tests, Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gates on *new* errors against eslint-baseline.json rather than on the
      # 76 that predate this workflow -- see frontend/scripts/lint-baseline.mjs.
      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
